<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story-to-AI</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; background: #f4f4f9; }
    textarea { width: 100%; height: 130px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
    select, button { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; border-radius: 8px; }
    button { background: #4f46e5; color: white; border: none; font-weight: bold; }
    #output { margin-top: 20px; background: white; padding: 15px; border-radius: 8px; white-space: pre-wrap; line-height: 1.5; }
  </style>
</head>
<body>
  <h2>✨ Story-to-AI</h2>
  <textarea id="storyInput" placeholder="Write or paste a short story here..."></textarea>
  <select id="styleSelect">
    <option value="Comic Book Script">Comic Book Script</option>
    <option value="Sci-Fi Movie Trailer">Sci-Fi Movie Trailer</option>
    <option value="Choose-Your-Own-Adventure Game">Choose-Your-Own-Adventure</option>
  </select>
  <button onclick="convertStory()">Transform Story</button>
  <div id="output">Your AI story will appear here...</div>
  <script>
    async function convertStory() {
      const story = document.getElementById('storyInput').value;
      const style = document.getElementById('styleSelect').value;
      const out = document.getElementById('output');
      if (!story.trim()) return out.textContent = 'Please enter a story first!';
      out.textContent = '✨ Transforming...';
      const res = await fetch('/api/transform', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ story, style })
      });
      const data = await res.json();
      out.textContent = data.result || data.error;
    }
  </script>
</body>
</html>
